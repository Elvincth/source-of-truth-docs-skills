    <path d="M32 38H142" stroke="#0F766E" stroke-width="12" stroke-linecap="round"/>
    <path d="M32 72H128" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
    <path d="M32 104H150" stroke="#CBD5E1" stroke-width="10" stroke-linecap="round"/>
  </g>

