<svg width="960" height="480" viewBox="0 0 960 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Source of Truth Docs Skills</title>
  <desc id="desc">A clean source-of-truth documentation badge with a SoT mark, document cards, and connected verification nodes.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="64" x2="880" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="surface" x1="150" y1="92" x2="810" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="cardShadow" x="116" y="56" width="728" height="368" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="960" height="480" rx="64" fill="#020617"/>
  <rect x="48" y="48" width="864" height="384" rx="52" fill="url(#background)"/>

  <g opacity="0.18" stroke="#FFFFFF" stroke-width="2">
    <path d="M130 126H830"/>
    <path d="M130 354H830"/>
    <path d="M210 86V394"/>
    <path d="M750 86V394"/>
  </g>

  <g filter="url(#cardShadow)">
