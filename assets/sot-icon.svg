  <text x="660" y="240" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="132" font-weight="850" letter-spacing="0" fill="#0F172A">SoT</text>
  <text x="660" y="292" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="750" letter-spacing="0" fill="#334155">SOURCE OF TRUTH</text>
  <text x="660" y="326" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="650" letter-spacing="0" fill="#64748B">DOCS SKILLS</text>
